name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Launch contract, overlay assembler and pins
        run: python3 -m unittest discover -s install -p 'test_*.py' -v
      - name: Shell scripts
        run: shellcheck -S warning -e SC2054 start.sh install/*.sh bench/*.sh
      - name: Python compiles
        run: python3 -m py_compile install/*.py bench/*.py docs/assets/make_cards.py
      - name: JSON is valid
        run: for f in install/*.json install/profiles/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Spark overlay pin
        run: |
          python3 - <<'PY'
          import json
          o = json.load(open("install/checkpoint.json"))["overlay"]
          if o["revision"] == "TODO":
              print("::warning file=install/checkpoint.json::The Spark overlay is not pinned yet; MODE=spark is refused until it is.")
          else:
              print("overlay pinned at", o["repository"], o["revision"])
          PY
      - name: Result receipts
        run: for d in results/*/; do (cd "$d" && sha256sum -c --quiet SHA256SUMS); done
